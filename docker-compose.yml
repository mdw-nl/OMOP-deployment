name: omop

# Data quality apps, all in the `quality` profile: `make quality-up` starts them.
include:
  - apps/compose.yml

services:
  postgres:
    # Debian-based, not -alpine: the initdb and helper scripts are bash, and glibc/ICU
    # collation handles the multilingual concept names in the vocabulary properly.
    image: postgres:16
    container_name: omop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omop}
      POSTGRES_USER: ${POSTGRES_USER:-omop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Consumed by initdb/01_apply_ddl.sh to substitute @cdmDatabaseSchema.
      CDM_SCHEMA: ${CDM_SCHEMA:-cdm}
      RESULTS_SCHEMA: ${RESULTS_SCHEMA:-results}
      TEMP_SCHEMA: ${TEMP_SCHEMA:-temp}
      # Consumed by initdb/02_vocab_reader.sh; empty password skips the role.
      VOCAB_READER_USER: ${VOCAB_READER_USER:-vocab_reader}
      VOCAB_READER_PASSWORD: ${VOCAB_READER_PASSWORD:-}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - omop_pgdata:/var/lib/postgresql/data
      # Runs once, only when the data volume is empty. `make reset` re-triggers it.
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./ddl:/ddl:ro
      - ./scripts:/scripts:ro
      - ./vocabulary:/vocabulary:ro
    # Defaults are sized for a toy database; the vocabulary load (CONCEPT_ANCESTOR alone
    # is tens of millions of rows) is the dominant cost of standing this up.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-512MB}
      - -c
      - work_mem=${PG_WORK_MEM:-64MB}
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-4GB}
      - -c
      - synchronous_commit=off
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # The DDL apply runs inside initdb, before Postgres accepts connections.
      start_period: 60s

  omop-init:
    # Loads the vocabulary (./vocabulary or VOCAB_URL) and applies constraints and
    # indices. Runs on every `make up`; each step is skipped when already done.
    # Follow it with `make logs-init`.
    build: ./docker/omop-init
    image: omop-deployment-init:local
    container_name: omop-init
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-omop}
      PGUSER: ${POSTGRES_USER:-omop}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      CDM_SCHEMA: ${CDM_SCHEMA:-cdm}
      # Optional; only used when ./vocabulary holds no CSVs and the vocabulary is empty.
      VOCAB_URL: ${VOCAB_URL:-}
    volumes:
      - ./scripts:/scripts:ro
      - ./ddl:/ddl:ro
      - ./vocabulary:/vocabulary:ro
      # Keeps the VOCAB_URL download, so a reload does not fetch it again.
      - omop_vocab_cache:/vocab_cache
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: omop-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set in .env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    volumes:
      - omop_pgadmin:/var/lib/pgadmin
      # Pre-registers the OMOP connection so there is no manual host/port entry.
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  omop_pgdata:
  omop_pgadmin:
  omop_vocab_cache:
