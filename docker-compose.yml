name: omop

services:
  postgres:
    # Debian-based, not -alpine: the initdb and helper scripts are bash, and glibc/ICU
    # collation handles the multilingual concept names in the vocabulary properly.
    image: postgres:16
    container_name: omop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omop}
      POSTGRES_USER: ${POSTGRES_USER:-omop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Consumed by initdb/01_apply_ddl.sh to substitute @cdmDatabaseSchema.
      CDM_SCHEMA: ${CDM_SCHEMA:-cdm}
      RESULTS_SCHEMA: ${RESULTS_SCHEMA:-results}
      TEMP_SCHEMA: ${TEMP_SCHEMA:-temp}
      # Consumed by initdb/02_vocab_reader.sh; empty password skips the role.
      VOCAB_READER_USER: ${VOCAB_READER_USER:-vocab_reader}
      VOCAB_READER_PASSWORD: ${VOCAB_READER_PASSWORD:-}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - omop_pgdata:/var/lib/postgresql/data
      # Runs once, only when the data volume is empty. `make reset` re-triggers it.
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./ddl:/ddl:ro
      - ./scripts:/scripts:ro
      - ./vocabulary:/vocabulary:ro
    # Defaults are sized for a toy database; the vocabulary load (CONCEPT_ANCESTOR alone
    # is tens of millions of rows) is the dominant cost of standing this up.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-512MB}
      - -c
      - work_mem=${PG_WORK_MEM:-64MB}
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-4GB}
      - -c
      - synchronous_commit=off
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # The DDL apply runs inside initdb, before Postgres accepts connections.
      start_period: 60s

  omop-init:
    # Loads the vocabulary (./vocabulary or VOCAB_URL), applies constraints and indices,
    # and prepares the DQD and Superset roles. Runs on every `up`; each step is skipped
    # when already done. Follow it with `make logs-init`.
    build: ./docker/omop-init
    image: omop-init:local
    container_name: omop-init
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-omop}
      PGUSER: ${POSTGRES_USER:-omop}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      CDM_SCHEMA: ${CDM_SCHEMA:-cdm}
      # Optional; only used when ./vocabulary holds no CSVs and the vocabulary is empty.
      VOCAB_URL: ${VOCAB_URL:-}
      DQD_PASSWORD: ${DQD_PASSWORD:?DQD_PASSWORD must be set in .env}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:?SUPERSET_DB_PASSWORD must be set in .env}
      SUPERSET_READER_PASSWORD: ${SUPERSET_READER_PASSWORD:?SUPERSET_READER_PASSWORD must be set in .env}
    volumes:
      - ./scripts:/scripts:ro
      - ./ddl:/ddl:ro
      - ./vocabulary:/vocabulary:ro
      # Keeps the VOCAB_URL download, so a reload does not fetch it again.
      - omop_vocab_cache:/vocab_cache
    depends_on:
      postgres:
        condition: service_healthy

  dqd:
    # OHDSI Data Quality Dashboard checks, on start and on DQD_SCHEDULE; `make dqd` runs
    # them now. Results go to the dqd_results schema.
    build: ./docker/dqd
    image: omop-dqd:local
    container_name: omop-dqd
    restart: unless-stopped
    environment:
      DQD_DB_HOST: postgres
      DQD_DB_PORT: "5432"
      DQD_DB_NAME: ${POSTGRES_DB:-omop}
      DQD_DB_PASSWORD: ${DQD_PASSWORD:?DQD_PASSWORD must be set in .env}
      CDM_SCHEMA: ${CDM_SCHEMA:-cdm}
      DQD_THREADS: ${DQD_THREADS:-2}
      # Cron expression, UTC (default: every night at 02:00)
      DQD_SCHEDULE: ${DQD_SCHEDULE:-0 2 * * *}
      DQD_RUN_ON_START: ${DQD_RUN_ON_START:-true}
    volumes:
      # JSON output of every run, readable by the DQD viewer
      - omop_dqd_output:/output
    depends_on:
      omop-init:
        condition: service_completed_successfully

  superset-init:
    # Prepares the Superset metadata database and admin user, and (re)imports the
    # "OMOP Data Quality" dashboard from docker/superset/assets on every start.
    build: ./docker/superset
    image: omop-superset:local
    container_name: omop-superset-init
    command: ["/app/docker/omop-init.sh"]
    environment: &superset-env
      OMOP_DB_HOST: postgres
      OMOP_DB_PORT: "5432"
      OMOP_DB_NAME: ${POSTGRES_DB:-omop}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:?SUPERSET_DB_PASSWORD must be set in .env}
      SUPERSET_READER_PASSWORD: ${SUPERSET_READER_PASSWORD:?SUPERSET_READER_PASSWORD must be set in .env}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?SUPERSET_ADMIN_PASSWORD must be set in .env}
      # Optional; generated on first start and kept in the omop_superset_home volume.
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-}
    volumes:
      - omop_superset_home:/app/superset_home
    depends_on:
      omop-init:
        condition: service_completed_successfully

  superset:
    image: omop-superset:local
    container_name: omop-superset
    restart: unless-stopped
    environment: *superset-env
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    volumes:
      - omop_superset_home:/app/superset_home
    depends_on:
      superset-init:
        condition: service_completed_successfully

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: omop-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set in .env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    volumes:
      - omop_pgadmin:/var/lib/pgadmin
      # Pre-registers the OMOP connection so there is no manual host/port entry.
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  omop_pgdata:
  omop_pgadmin:
  omop_vocab_cache:
  omop_dqd_output:
  omop_superset_home:
