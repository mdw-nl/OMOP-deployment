# Data quality checks (OHDSI DQD) and the Superset dashboard for the OMOP database in
# the Postgres you already run:  make apps-up
#
# A separate compose project: it starts only the containers below and never touches
# your own containers or volumes. Like the scripts, it talks SQL to your database:
# omop-init creates the dqd/superset roles, the dqd_results schema, the `superset`
# metadata database and a cdm_source row if missing. The vocabulary stays with
# `make load-vocab` / `make finalize`.
#
# Reads the same .env as the scripts. The containers reach your Postgres through
# OMOP_DB_HOST, by default the Docker host, so its port must be published there.
name: omop-apps

x-database: &database
  # host.docker.internal resolves to the Docker host on Linux too, through extra_hosts.
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  omop-init:
    <<: *database
    build: ../docker/omop-init
    image: omop-deployment-init:local
    environment:
      PGHOST: ${OMOP_DB_HOST:-host.docker.internal}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${TARGET_DB:-omop}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:?PGPASSWORD must be set in .env}
      CDM_SCHEMA: ${CDM_SCHEMA:-cdm}
      # Vocabulary, constraints and indices are the scripts' job here.
      INIT_LOAD_VOCAB: "false"
      INIT_FINALIZE: "false"
      DQD_PASSWORD: ${DQD_PASSWORD:?DQD_PASSWORD must be set in .env}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:?SUPERSET_DB_PASSWORD must be set in .env}
      SUPERSET_READER_PASSWORD: ${SUPERSET_READER_PASSWORD:?SUPERSET_READER_PASSWORD must be set in .env}

  dqd:
    <<: *database
    build: ../docker/dqd
    image: omop-deployment-dqd:local
    restart: unless-stopped
    environment:
      DQD_DB_HOST: ${OMOP_DB_HOST:-host.docker.internal}
      DQD_DB_PORT: ${PGPORT:-5432}
      DQD_DB_NAME: ${TARGET_DB:-omop}
      DQD_DB_PASSWORD: ${DQD_PASSWORD:?DQD_PASSWORD must be set in .env}
      CDM_SCHEMA: ${CDM_SCHEMA:-cdm}
      DQD_THREADS: ${DQD_THREADS:-2}
      # Cron expression, UTC (default: every night at 02:00)
      DQD_SCHEDULE: ${DQD_SCHEDULE:-0 2 * * *}
      DQD_RUN_ON_START: ${DQD_RUN_ON_START:-true}
    volumes:
      - dqd_output:/output
    depends_on:
      omop-init:
        condition: service_completed_successfully

  superset-init:
    <<: *database
    build: ../docker/superset
    image: omop-deployment-superset:local
    command: ["/app/docker/omop-init.sh"]
    environment: &superset-env
      OMOP_DB_HOST: ${OMOP_DB_HOST:-host.docker.internal}
      OMOP_DB_PORT: ${PGPORT:-5432}
      OMOP_DB_NAME: ${TARGET_DB:-omop}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:?SUPERSET_DB_PASSWORD must be set in .env}
      SUPERSET_READER_PASSWORD: ${SUPERSET_READER_PASSWORD:?SUPERSET_READER_PASSWORD must be set in .env}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?SUPERSET_ADMIN_PASSWORD must be set in .env}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-}
    volumes:
      - superset_home:/app/superset_home
    depends_on:
      omop-init:
        condition: service_completed_successfully

  superset:
    <<: *database
    image: omop-deployment-superset:local
    restart: unless-stopped
    environment: *superset-env
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    volumes:
      - superset_home:/app/superset_home
    depends_on:
      superset-init:
        condition: service_completed_successfully

volumes:
  dqd_output:
  superset_home:
