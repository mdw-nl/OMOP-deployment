metrics:
- metric_name: pct_passed
  verbose_name: Pass rate
  metric_type: null
  expression: 1.0 * SUM(CASE WHEN check_status = 'Passed' THEN 1 ELSE 0 END) / NULLIF(SUM(CASE
    WHEN check_status <> 'Not applicable' THEN 1 ELSE 0 END), 0)
  description: Passed checks as a share of the applicable checks, as in the DQD overview
  d3format: .1%
  currency: null
  extra: null
  warning_text: null
- metric_name: applicable_checks
  verbose_name: Checks executed
  metric_type: null
  expression: SUM(CASE WHEN check_status <> 'Not applicable' THEN 1 ELSE 0 END)
  description: Checks which are applicable to the data
  d3format: ',d'
  currency: null
  extra: null
  warning_text: null
- metric_name: not_applicable_checks
  verbose_name: Not applicable
  metric_type: null
  expression: SUM(CASE WHEN check_status = 'Not applicable' THEN 1 ELSE 0 END)
  description: Checks on empty tables or fields
  d3format: ',d'
  currency: null
  extra: null
  warning_text: null
- metric_name: error_checks
  verbose_name: Errors
  metric_type: null
  expression: SUM(CASE WHEN check_status = 'Error' THEN 1 ELSE 0 END)
  description: Checks which could not be executed
  d3format: ',d'
  currency: null
  extra: null
  warning_text: null
- metric_name: failed_checks
  verbose_name: Failed
  metric_type: null
  expression: SUM(CASE WHEN check_status = 'Failed' THEN 1 ELSE 0 END)
  description: Checks which exceeded their threshold
  d3format: ',d'
  currency: null
  extra: null
  warning_text: null
- metric_name: passed_checks
  verbose_name: Passed
  metric_type: null
  expression: SUM(CASE WHEN check_status = 'Passed' THEN 1 ELSE 0 END)
  description: Checks which passed their threshold
  d3format: ',d'
  currency: null
  extra: null
  warning_text: null
- metric_name: check_count
  verbose_name: Checks
  metric_type: null
  expression: COUNT(*)
  description: Number of checks
  d3format: ',d'
  currency: null
  extra: null
  warning_text: null
