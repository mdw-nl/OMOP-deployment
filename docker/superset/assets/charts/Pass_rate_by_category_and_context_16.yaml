slice_name: Pass rate by category and context
description: 'Kahn framework overview as in the DQD dashboard: pass rate per category
  (conformance, completeness, plausibility) and context (verification, validation)'
certified_by: null
certification_details: null
viz_type: pivot_table_v2
params:
  datasource: 1__table
  viz_type: pivot_table_v2
  adhoc_filters:
  - expressionType: SQL
    sqlExpression: is_latest_run
    clause: WHERE
    filterOptionName: latest_run
  groupbyRows:
  - category
  groupbyColumns:
  - context
  metrics:
  - pct_passed
  - failed_checks
  metricsLayout: ROWS
  aggregateFunction: Sum
  valueFormat: SMART_NUMBER
  rowTotals: false
  colTotals: false
  row_limit: 1000
  conditional_formatting:
  - colorScheme: '#ACE1C4'
    column: pct_passed
    operator: "\u2265"
    targetValue: 0.95
  - colorScheme: '#EFA1AA'
    column: pct_passed
    operator: <
    targetValue: 0.95
query_context: null
cache_timeout: null
